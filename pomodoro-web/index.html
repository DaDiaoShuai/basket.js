<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄闹钟</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <h1>🍅 番茄闹钟</h1>
    <p class="subtitle">专注 25 分钟，休息 5 分钟。也可以按你的节奏自定义。</p>

    <section class="timer-card" aria-live="polite">
      <p id="modeLabel" class="mode">专注时间</p>
      <p id="timeDisplay" class="time">25:00</p>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="statusText" class="status">准备开始</p>
    </section>

    <section class="controls">
      <button id="startPauseBtn" class="btn primary" type="button">开始</button>
      <button id="resetBtn" class="btn" type="button">重置</button>
      <button id="skipBtn" class="btn" type="button">跳过</button>
    </section>

    <section class="settings">
      <h2>设置</h2>
      <label>
        专注时长（分钟）
        <input id="workInput" type="number" min="1" max="90" value="25" />
      </label>
      <label>
        休息时长（分钟）
        <input id="breakInput" type="number" min="1" max="30" value="5" />
      </label>
      <p class="counter">已完成番茄数：<span id="pomodoroCount">0</span></p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
